services:
  - type: web
    name: valoraai-price-predictor
    env: python
    plan: free
    rootDir: .
    buildCommand: >
      apt-get update -qq &&
      apt-get install -y git-lfs &&
      git lfs install &&
      git lfs pull &&
      pip install -r deployment/requirements.txt
    startCommand: >
      streamlit run app/app.py 
      --server.port $PORT 
      --server.address 0.0.0.0 
      --server.headless true 
      --server.enableCORS false 
      --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false          
      - key: CHAT_API_URL
        value: ""            
      - key: OMP_NUM_THREADS 
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
